name: build

# Stratos — unified build pipeline (replaces the previous ci.yml + release.yml pair).
#
#   push / PR  →  gates (Go tests + Kotlin JVM tests)  →  debug APK artifact
#   tag v*     →  gates → release APK → GitHub Release with SHA-256 checksums
#
# Signing policy: when the keystore secrets are configured the release APK is
# signed; otherwise a clearly-labelled DEBUG APK is published instead — a
# DOCUMENTED skip, never a red run.
#
# Required GitHub secrets (optional — only for signed releases):
#   ANDROID_KEYSTORE_B64     base64 of stratos.keystore   (base64 -w0 < stratos.keystore)
#   STRATOS_KS_PASS          keystore + key password
#   STRATOS_KEY_ALIAS        key alias (default "stratos")
#
# NOTE: no tokens belong in this file. Authentication is GitHub's own; the
# personal access token used for the initial push never enters the repository.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  gates:
    name: Quality gates (Go + JVM tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Go engine tests (race-clean)
        uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      - run: go test ./... -race
        working-directory: engine

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Kotlin JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  apk:
    name: Debug APK
    needs: gates
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stratos-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Release (tag v*)
    needs: gates
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing-secrets presence check (absent secrets = a DOCUMENTED skip, not a red run)
        id: sec
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "RELEASE_SIGNING_SKIPPED — signing secrets not configured on this repo; a debug APK will be published instead. Add ANDROID_KEYSTORE_B64 + STRATOS_KS_PASS to publish a signed release APK."
          fi

      - name: Restore signing keystore
        if: steps.sec.outputs.present == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/stratos.keystore"
          chmod 600 "$RUNNER_TEMP/stratos.keystore"

      - name: Build APKs
        env:
          STRATOS_KEYSTORE_FILE: ${{ steps.sec.outputs.present == 'true' && format('{0}/stratos.keystore', runner.temp) || '' }}
          STRATOS_KEYSTORE_PASSWORD: ${{ secrets.STRATOS_KS_PASS }}
          STRATOS_KEY_ALIAS: ${{ secrets.STRATOS_KEY_ALIAS || 'stratos' }}
          STRATOS_KEY_PASSWORD: ${{ secrets.STRATOS_KS_PASS }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Collect artifacts + checksums
        id: collect
        env:
          SIGNED: ${{ steps.sec.outputs.present }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          OUT="release-assets"
          mkdir -p "$OUT"
          if [ "$SIGNED" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "$OUT/Stratos-${VER}-release.apk"
            if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
              cp app/build/outputs/mapping/release/mapping.txt "$OUT/Stratos-${VER}-mapping.txt"
            fi
            echo "kind=release" >> "$GITHUB_OUTPUT"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "$OUT/Stratos-${VER}-debug.apk"
            echo "kind=debug" >> "$GITHUB_OUTPUT"
          fi
          ( cd "$OUT" && sha256sum *.apk > "Stratos-${VER}-SHA256.txt" )
          ls -la "$OUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          body: |
            **Stratos ${{ github.ref_name }}**

            ${{ steps.collect.outputs.kind == 'release' && '✅ Signed release APK (R8 minified).' || '⚠️ `RELEASE_SIGNING_SKIPPED` — this is the **debug** build of the release tag. Configure the `ANDROID_KEYSTORE_B64` + `STRATOS_KS_PASS` secrets to publish signed release APKs.' }}

            Verify with: `sha256sum -c Stratos-*-SHA256.txt`
