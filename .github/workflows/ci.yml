name: ci

# Stratos CI — adapted from the two-pipeline pattern (gates -> compile):
#   job "gates": Go engine tests + Kotlin JVM tests (no SDK pieces needed for go; SDK is preinstalled for gradle)
#   job "apk":   installable debug APK artifact on every push/PR
# Signing NEVER happens here — that is release.yml with real secrets only.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Quality gates (Go + JVM tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Go engine tests (race-clean)
        uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      - run: go test ./... -race
        working-directory: engine

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Kotlin JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
          if-no-files-found: ignore

  apk:
    name: Debug APK
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stratos-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
